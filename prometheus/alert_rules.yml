groups:
  - name: infra
    rules:
      - alert: HighCPU
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100 > 85
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "CPU above 85% for 2 minutes"}

      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "Memory above 85%"}

      - alert: LowDisk
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Disk above 85% on {{ $labels.mountpoint }}"}

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.job }} is down"}

      - alert: WebsiteDown
        expr: probe_success == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.instance }} is not responding"}
